name: Ubuntu 24.04 / ROS 2 Jazzy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=7,<10' 'PyYAML>=6,<7'
      - name: Python regression tests
        run: python -m pytest warehouse_motion/test -q
      - name: C++ protocol and serial tests (fake device only)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I warehouse_gripper/include warehouse_gripper/test/test_protocol.cpp -o /tmp/gripper_protocol_test
          /tmp/gripper_protocol_test
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -I warehouse_gripper/include warehouse_gripper/test/test_rtu_session.cpp -o /tmp/gripper_rtu_test
          /tmp/gripper_rtu_test

  jazzy-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ros_ws/src/robotArm_Controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DoosanRobotics/doosan-robot2
          ref: dade65d3a99dd8b29d8eca3689a4ead74f228d77
          path: ros_ws/src/doosan-robot2
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libpoco-dev libyaml-cpp-dev libboost-system-dev libboost-thread-dev python3-colcon-common-extensions python3-pytest python3-yaml ros-jazzy-controller-manager ros-jazzy-kdl-parser ros-jazzy-moveit-msgs ros-jazzy-joint-state-broadcaster
      - name: Build the pinned Doosan driver (no robot connection)
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select dsr_msgs2 dsr_common2 dsr_hardware2 --cmake-args -DBUILD_TESTING=OFF
      - name: Build warehouse packages
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon build --packages-select warehouse_interfaces warehouse_gripper warehouse_motion --cmake-args -DBUILD_TESTING=ON
      - name: Verify shared library and launch arguments
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ldd -r install/warehouse_gripper/lib/libwarehouse_gripper.so | tee /tmp/gripper-link.txt
          if grep -E 'not found|undefined symbol' /tmp/gripper-link.txt; then exit 1; fi
          ros2 launch warehouse_gripper gripper.launch.py --show-args
      - name: Run package tests (no driver bringup or motion)
        working-directory: ros_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select warehouse_gripper warehouse_motion --return-code-on-test-failure --event-handlers console_direct+
          colcon test-result --verbose
