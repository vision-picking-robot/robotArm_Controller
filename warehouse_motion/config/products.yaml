# 상품 설정 (단위: mm, deg / 기준 좌표계: base)
#
# - x, y: YOLO 연동 전 임시 고정 좌표. YOLO 연동 후에는 호모그래피 변환값으로 대체된다.
# - grasp_height_from_floor: 바닥 기준 집는 높이. 실행 시 z = floor_z + grasp_height_from_floor
#   계산된 z 가 하한선보다 낮으면 그 상품은 실행하지 않고 보고한다.
# - rz: 손목 회전 (1차 버전은 고정 방향 가정)
# - grip_force: 이전 예제의 미사용 필드. 실제 파지에는 gripper_profiles.yaml을 사용한다.
# - taught: 실물에 상품을 놓고 직접 교시했으면 true.
#
# ⚠️ 아래 virtual 값은 가상 모드 테스트용 임의값이다. 실물 로봇 좌표가 아니다.
#    실물 모드는 real 값(교시값)만 사용하며, taught: false 인 상품은 실행을 거부한다.

products:
  snack_box:          # 곽과자
    real:
      x: null
      y: null
      rz: null
      grasp_height_from_floor: null
      taught: false
    virtual: {x: 450.0, y: 150.0, rz: 0.0, grasp_height_from_floor: 40.0}
    grip_force: null

  pet_bottle:         # 페트 음료
    real:
      x: null
      y: null
      rz: null
      grasp_height_from_floor: null
      taught: false
    virtual: {x: 450.0, y: 50.0, rz: 0.0, grasp_height_from_floor: 120.0}
    grip_force: null

  can:                # 스팸/참치캔
    real:
      x: null
      y: null
      rz: null
      grasp_height_from_floor: null
      taught: false
    virtual: {x: 450.0, y: -50.0, rz: 0.0, grasp_height_from_floor: 30.0}
    grip_force: null

  wet_tissue:         # 물티슈
    real:
      x: null
      y: null
      rz: null
      grasp_height_from_floor: null
      taught: false
    virtual: {x: 550.0, y: 100.0, rz: 0.0, grasp_height_from_floor: 25.0}
    grip_force: null

  doll:               # 인형
    real:
